[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-team"
version = "0.1.0"
description = "Autonomous AI Engineering Team - CLI"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
]

[project.scripts]
ai-team = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["brain*", "cli*", "core*", "providers*", "app*", "models*", "pipeline*", "execution*"]
